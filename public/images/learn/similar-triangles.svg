<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630"><rect width="1200" height="630" fill="#0c1625"/><text x="66" y="60" fill="#5eead4" font-size="19" font-family="sans-serif">CRAZYCLOUDCC / VISUAL LAB</text><text x="66" y="125" fill="#f1f6ff" font-size="46" font-family="sans-serif">Similar Triangles</text><text x="66" y="167" fill="#c5d6e9" font-size="24" font-family="sans-serif">A point light, a person, and a shadow. Match before calculating.</text><polygon points="130,230 130,490 390,490" fill="#164f48" stroke="#5eead4" stroke-width="3"/><polygon points="303.333,403.333 303.333,490 390,490" fill="#284a77" stroke="#8cbcff" stroke-width="3"/><path d="M90 490H440 M130 472H148V490 M303.333 478H315.333V490" fill="none" stroke="#c5d6e9" stroke-width="2"/><text x="70" y="365" fill="#c5d6e9" font-size="23" font-family="sans-serif">H=6</text><text x="320" y="441" fill="#c5d6e9" font-size="23" font-family="sans-serif">h=2</text><text x="205" y="527" fill="#c5d6e9" font-size="23" font-family="sans-serif">x=4</text><text x="325" y="527" fill="#c5d6e9" font-size="23" font-family="sans-serif">s=2</text><text x="580" y="300" fill="#5eead4" font-size="30" font-family="sans-serif">Same angles. Matching sides.</text><text x="580" y="369" fill="#c5d6e9" font-size="36" font-family="sans-serif">H / (x+s) = h / s</text><text x="580" y="435" fill="#8cbcff" font-size="36" font-family="sans-serif">s = hx / (H-h)</text><text x="66" y="575" fill="#5eead4" font-size="24" font-family="sans-serif">AA similarity / corresponding sides / fixed-height proportionality</text></svg>