<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630"><rect width="1200" height="630" fill="#0c1625"/><text x="66" y="60" fill="#5eead4" font-size="19" font-family="sans-serif">CRAZYCLOUDCC / VISUAL LAB</text><text x="66" y="125" fill="#f1f6ff" font-size="46" font-family="sans-serif">Prefix Sum / Cancel the shared prefix</text><text x="66" y="167" fill="#c5d6e9" font-size="24" font-family="sans-serif">Align boundaries. Subtract the same terms.</text><rect x="150" y="300" width="600" height="45" fill="#284a77"/><rect x="150" y="365" width="240" height="45" fill="#593e32"/><rect x="390" y="435" width="360" height="45" fill="#164f48"/><text x="150" y="260" fill="#c5d6e9" font-size="30" font-family="sans-serif">P[r]: 4 - 6 + 3 + 0 + 5</text><text x="150" y="400" fill="#c5d6e9" font-size="28" font-family="sans-serif">P[l]: 4 - 6</text><text x="410" y="470" fill="#5eead4" font-size="30" font-family="sans-serif">3 + 0 + 5 = 8</text><text x="800" y="340" fill="#c5d6e9" font-size="35" font-family="sans-serif">6 - (-2)</text><text x="800" y="405" fill="#5eead4" font-size="42" font-family="sans-serif">= 8</text><text x="66" y="575" fill="#5eead4" font-size="24" font-family="sans-serif">Half-open interval / signed values / O(1) static queries</text></svg>