<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630"><rect width="1200" height="630" fill="#0c1625"/><text x="66" y="60" fill="#5eead4" font-size="19" font-family="sans-serif">CRAZYCLOUDCC / VISUAL LAB</text><text x="66" y="125" fill="#f1f6ff" font-size="46" font-family="sans-serif">Coordinate Distance</text><text x="66" y="167" fill="#c5d6e9" font-size="24" font-family="sans-serif">Signed changes. Nonnegative lengths. One right triangle.</text><path d="M90 360H490M310 200V535" stroke="#48647c" stroke-width="2"/><path d="M230 320H350V480Z" fill="#164f48" stroke="#5eead4" stroke-width="4"/><path d="M230 320H350" stroke="#f2b36f" stroke-width="4"/><path d="M350 320V480" stroke="#8cbcff" stroke-width="4"/><text x="125" y="290" fill="#c5d6e9" font-size="25" font-family="sans-serif">A(-2,1)</text><text x="355" y="512" fill="#c5d6e9" font-size="25" font-family="sans-serif">B(1,-3)</text><text x="590" y="295" fill="#c5d6e9" font-size="35" font-family="sans-serif">dx=3, dy=-4</text><text x="590" y="367" fill="#5eead4" font-size="35" font-family="sans-serif">d² = 3² + (-4)²</text><text x="590" y="447" fill="#f2b36f" font-size="44" font-family="sans-serif">d = 5</text><text x="66" y="575" fill="#5eead4" font-size="24" font-family="sans-serif">Equal scales / signed coordinates / translation invariance</text></svg>