<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630"><rect width="1200" height="630" fill="#0c1625"/><text x="66" y="60" fill="#5eead4" font-size="19" font-family="sans-serif">CRAZYCLOUDCC / VISUAL LAB</text><text x="66" y="125" fill="#f1f6ff" font-size="46" font-family="sans-serif">Radians</text><text x="66" y="167" fill="#c5d6e9" font-size="24" font-family="sans-serif">Unroll an arc. Count radius lengths.</text><circle cx="280" cy="365" r="130" fill="none" stroke="#48647c" stroke-width="2"/><path d="M410 365A130 130 0 0 0 280 235" fill="none" stroke="#5eead4" stroke-width="7"/><path d="M280 235V365H410" fill="none" stroke="#f2b36f" stroke-width="3"/><path d="M580 430H784.2" stroke="#5eead4" stroke-width="7"/><text x="580" y="285" fill="#5eead4" font-size="40" font-family="sans-serif">theta = s / r</text><text x="580" y="345" fill="#c5d6e9" font-size="28" font-family="sans-serif">Same angle. Same ratio.</text><text x="580" y="490" fill="#c5d6e9" font-size="27" font-family="sans-serif">r=1: s=pi/2</text><text x="66" y="575" fill="#5eead4" font-size="24" font-family="sans-serif">Angle / arc length / unit circle / length-preserving unroll</text></svg>