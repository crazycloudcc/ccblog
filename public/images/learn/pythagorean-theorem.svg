<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630"><rect width="1200" height="630" fill="#0c1625"/><text x="66" y="60" fill="#5eead4" font-size="19" font-family="sans-serif">CRAZYCLOUDCC / VISUAL LAB</text><text x="66" y="125" fill="#f1f6ff" font-size="46" font-family="sans-serif">Pythagorean Theorem</text><text x="66" y="167" fill="#c5d6e9" font-size="24" font-family="sans-serif">Same four triangles. Same frame. Equal remaining areas.</text><rect x="105" y="225" width="266" height="266" fill="#c5d6e9" stroke="#91a8c5"/><polygon points="219,225 371,339 257,491 105,377" fill="#164f48"/><polygon points="105,225 219,225 105,377" fill="#45372d" stroke="#f2b36f" stroke-width="2"/><polygon points="371,225 371,339 219,225" fill="#45372d" stroke="#f2b36f" stroke-width="2"/><polygon points="371,491 257,491 371,339" fill="#45372d" stroke="#f2b36f" stroke-width="2"/><polygon points="105,491 105,377 257,491" fill="#45372d" stroke="#f2b36f" stroke-width="2"/><text x="183" y="368" fill="#f1f6ff" font-size="25" font-family="sans-serif">c²=25</text><rect x="700" y="225" width="266" height="266" fill="#c5d6e9" stroke="#91a8c5"/><rect x="700" y="225" width="114" height="114" fill="#164f48"/><rect x="814" y="339" width="152" height="152" fill="#284a77"/><polygon points="700,339 814,339 700,491" fill="#45372d" stroke="#f2b36f" stroke-width="2"/><polygon points="966,225 966,339 814,225" fill="#45372d" stroke="#f2b36f" stroke-width="2"/><polygon points="814,491 700,491 814,339" fill="#45372d" stroke="#f2b36f" stroke-width="2"/><polygon points="814,339 814,225 966,339" fill="#45372d" stroke="#f2b36f" stroke-width="2"/><text x="718" y="292" fill="#f1f6ff" font-size="23" font-family="sans-serif">a²=9</text><text x="832" y="418" fill="#f1f6ff" font-size="23" font-family="sans-serif">b²=16</text><text x="474" y="372" fill="#5eead4" font-size="30" font-family="sans-serif">25 = 9 + 16</text><text x="66" y="575" fill="#5eead4" font-size="24" font-family="sans-serif">Right triangle / a² + b² = c² / area-preserving dissection</text></svg>