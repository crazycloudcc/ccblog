<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630"><rect width="1200" height="630" fill="#0c1625"/><text x="66" y="60" fill="#5eead4" font-size="19" font-family="sans-serif">CRAZYCLOUDCC / VISUAL LAB</text><text x="66" y="125" fill="#f1f6ff" font-size="46" font-family="sans-serif">Euclidean Algorithm / GCD</text><text x="66" y="167" fill="#c5d6e9" font-size="24" font-family="sans-serif">Keep the remainder. Preserve common divisors.</text><rect x="100" y="245" width="576" height="216" fill="#164f48" stroke="#5eead4" stroke-width="3"/><path d="M316 245V461M532 245V461M532 389H676M604 389V461" fill="none" stroke="#f2b36f" stroke-width="3"/><text x="720" y="310" fill="#5eead4" font-size="29" font-family="sans-serif">48 = 2 × 18 + 12</text><text x="720" y="365" fill="#c5d6e9" font-size="29" font-family="sans-serif">18 = 1 × 12 + 6</text><text x="720" y="420" fill="#f2b36f" font-size="36" font-family="sans-serif">gcd = 6</text><text x="66" y="575" fill="#5eead4" font-size="24" font-family="sans-serif">Integer division / rectangle dissection / largest equal tile</text></svg>